  async function addScore(id, delta) {

  async function saveMember(id, slot, payload) {

    }
    const r=mutateLocalGroup(id,apply); return r.ok?{ok:true}:{ok:false,error:'這個小精靈欄位尚未解鎖'};
  }
  async function buyItem(id, itemId) {
    const item=SHOP[itemId]; if(!item) return {ok:false,error:'未知物品'};

      const ref=db.ref(`${basePath()}/${id}`); const r=await ref.transaction(raw=>{const g=normalizeGroup(raw,id);if(apply(g)===false)return;return g;});

  async function placeItem(id, itemId, slot) {

    if(ensureFirebase()){const ref=db.ref(`${basePath()}/${id}`);const r=await ref.transaction(raw=>{const g=normalizeGroup(raw,id);if(apply(g)===false)return;return g;});return r.committed?{ok:true}:{ok:false,error:'物品不足或位置已被使用'};}

  }
  async function removePlacement(id, slot) {
    slot=String(Math.floor(Number(slot)||0));

    if(ensureFirebase()){const ref=db.ref(`${basePath()}/${id}`);const r=await ref.transaction(raw=>{const g=normalizeGroup(raw,id);if(apply(g)===false)return;return g;});return r.committed?{ok:true}:{ok:false,error:'這個位置沒有物品'};}
    const r=mutateLocalGroup(id,apply);return r.ok?{ok:true}:{ok:false,error:'這個位置沒有物品'};
  }
  function resetLocalDemo() { if(!room){localStorage.removeItem(localKey);global.dispatchEvent(new CustomEvent('emotion-v3-local-change'));} }
  async function resetAllScores() {
    const resetOne=(g,id)=>{g=normalizeGroup(g,id);g.score=0;g.progressScore=0;g.spendablePoints=START_POINTS;g.updatedAt=now();return g;};

      return {ok:!!r.committed};

  }
