async function saveLayoutDraft(){

  [a,b].forEach(x=>{if(x){x.disabled=true;x.dataset.oldText=x.textContent;x.textContent='儲存中…'}});
  try{
    const r=await D.saveLayout(gid,layoutDraft.inventory,layoutDraft.placements);
    if(!r||!r.ok){toast((r&&r.error)||'儲存失敗');return}
    layoutDirty=false;stopPlace(true);

  }catch(err){console.error('[emotion-island] saveLayoutDraft failed',err);toast('儲存失敗：請再試一次')}

}
