*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07152f;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}body{background:radial-gradient(circle at 35% 32%,#6b5f9f 0,#233b7e 34%,#0a1c43 69%,#061126 100%)}#stage{position:fixed;inset:0}canvas{display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;z-index:8}.title-card{position:absolute;left:24px;top:22px;min-width:290px;max-width:min(430px,calc(100vw - 48px));padding:16px 19px 17px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(8,17,48,.74),rgba(81,49,95,.30));backdrop-filter:blur(18px) saturate(1.18);box-shadow:0 20px 70px rgba(0,0,0,.22);pointer-events:auto}.eyebrow{font-size:9px;font-weight:1000;letter-spacing:.22em;color:#c7efff}.title-card h1{margin:6px 0 2px;font-size:clamp(27px,3vw,42px);letter-spacing:.055em}.title-card p{margin:0;color:var(--muted);font-size:10px;line-height:1.65}.badge{display:inline-flex;margin-top:9px;padding:6px 9px;border:1px solid rgba(255,229,170,.22);border-radius:999px;background:linear-gradient(90deg,rgba(255,226,164,.13),rgba(137,225,255,.10));font-size:9px;font-weight:1000;color:#fff0c7}.actions{position:absolute;right:22px;top:22px;display:flex;gap:8px;pointer-events:auto}.btn{border:1px solid var(--line);border-radius:16px;padding:11px 14px;background:rgba(7,16,45,.62);backdrop-filter:blur(15px);color:#fff;font:inherit;font-size:11px;font-weight:1000;cursor:pointer;box-shadow:0 12px 38px rgba(0,0,0,.17);transition:.17s ease}.btn:hover{transform:translateY(-2px);background:rgba(30,49,83,.78)}.btn.primary{color:#14233f;background:linear-gradient(90deg,#baf0ff,#ffe5b0);border-color:rgba(255,255,255,.40)}.hint{position:absolute;left:50%;top:23px;transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(5,13,36,.30);backdrop-filter:blur(10px);font-size:9px;color:rgba(255,255,255,. <div class="hud">
  <div class="title-card"><div class="eyebrow">LEAD SHOWCASE · OFFICIAL DEMO WORLD</div><h1>主領班 · 共感典範島</h1><p>不是第九組，也不參與排名。這是一座固定完成形態的示範世界，用來展示「自己的小世界可以被佈置到什麼程度」。</p><div class="badge">✦ 固定展示 · 不受重置影響 · 不可編輯</div></div>
  <div class="hint">拖曳旋轉 · 滾輪縮放 · 右鍵拖曳平移</div>
  <div class="actions"><button class="btn primary" id="bestView">◎ 最佳視角</button><button class="btn" id="tourBtn">◌ 電影巡航</button><button class="btn" id="fxBtn">✨ 光影</button><button class="btn" id="backBtn">↩ 返回大世界</button></div>
  <div class="story"><b>共感典範島</b>　星願神木、櫻庭、晶石觀測台、瀑布高台、摩天輪、旋轉木馬、環島列車與小精靈共同生活。這裡不需要分數，它永遠維持「完成後最漂亮的樣子」。</div>
  <div class="stamp">主領班展示世界 · SHOWCASE ONLY</div>
  <div class="vignette"></div><div class="grain"></div>
</div>

const water=new THREE.Mesh(new THREE.PlaneGeometry(190,190,150,150),waterMat);water.rotation.x=-Math.PI/2;water.position.y=-9.2;scene.add(water);

const rockBody=new THREE.Mesh(new THREE.CylinderGeometry(13.6,16.1,8.2,24,1,false),rockMat);rockBody.position.y=-3.7;rockBody.castShadow=rockBody.receiveShadow=true;world.add(rockBody);const grassTop=new THREE.Mesh(new THREE.CylinderGeometry(14.75,15.15,.72,24),grassMat);grassTop.position.y=.14;grassTop.receiveShadow=true;world.add(grassTop);const rim=new THREE.Mesh(new THREE.TorusGeometry(14.86,.13,8,128),rimMat);rim.rotation.x=Math.PI/2;rim.position.y=.51;world.add(rim);

function heroTree(){const g=new THREE.Group();const trunk=toon(0x694d56,{roughness:.9});const main=new THREE.Mesh(new THREE.CylinderGeometry(.70,1.08,6.1,10),trunk);main.position.y=3.0;main.castShadow=true;g.add(main);for(const a of[-1.15,-.55,.45,1.05]){const b=new THREE.Mesh(new THREE.CylinderGeometry(.22,.38,3.1,8),trunk);b.position.set(Math.sin(a)*1.15,5.0,Math.cos(a)*1.0);b.rotation.z=-Math.sin(a)*.75;b.rotation.x=Math.cos(a)*.28;g.add(b)}const cols=[0x74e6a8,0x99efbc,0xffc4df,0xd9c0ff,0xb4f2e7];for(let i=0;i<18;i++){const a=i/18*Math.PI*2,r=1.4+(i%5)*.40,l=new THREE.Mesh(new THREE.IcosahedronGeometry(1.18+(i%3)*.12,1),toon(cols[i%cols.length],{roughness:.80}));l.position.set(Math.cos(a)*r,6.2+(i%4)*.42,Math.sin(a)*r*.82);l.scale.set(1.18,.78,1.02);l.castShadow=true;g.add(l);if(i%2===0){const line=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.65,5),basic(0xffe1a7,.78));line.position.set(l.position.x*.92,l.position.y-.95,l.position.z*.92);g.add(line);const gem=glowSphere(.10,i%4===0?0xffd17a:0x9eefff,line.position.x,line.position.y-.38,line.position.z,g);animations.push((t)=>{gem.material.opacity=.60+.35*Math.sin(t*.003+i);gem.scale.setScalar(.9+.18*Math.sin(t*.0025+i))})}}g.position.set(0,3.25,-3.0);world.add(g);swayers.push({g,amp:.006,phase:1.1});return g}
