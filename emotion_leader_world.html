// Atmospheric motes, intentionally sparse and colored — no white wash.
for(let i=0;i<78;i++){const c=i%4===0?0xe8b85b:(i%4===1?0x5edbd7:(i%4===2?0xe783a5:0x75c993));const p=glow(world,.032+(i%3)*.009,c,(Math.random()-.5)*27,1.7+Math.random()*10,(Math.random()-.5)*22,.38+Math.random()*.30);fireflies.push({p,phase:Math.random()*6,speed:.5+Math.random()*.9,baseY:p.position.y,baseX:p.position.x,baseZ:p.position.z})}

let yaw=.10,pitch=.30,dist=38,panX=0,panZ=-.8,targetYaw=yaw,targetPitch=pitch,targetDist=dist,targetPanX=panX,targetPanZ=panZ,drag=false,button=0,lastX=0,lastY=0;const look=new THREE.Vector3(0,2.5,-.8),smoothLook=look.clone();

document.getElementById('bestView').onclick=resetView;renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==2)return;drag=true;button=e.button;lastX=e.clientX;lastY=e.clientY;autoTour=false;syncTour();try{renderer.domElement.setPointerCapture(e.pointerId)}catch(_){}});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(button===2){const rx=Math.cos(targetYaw),rz=-Math.sin(targetYaw),fx=-Math.sin(targetYaw),fz=-Math.cos(targetYaw),s=.032;targetPanX+=(-dx*rx+dy*fx)*s;targetPanZ+=(-dx*rz+dy*fz)*s}else{targetYaw-=dx*.0052;targetPitch=clamp(targetPitch-dy*.0038,.14,.76)}});renderer.domElement.addEventListener('pointerup',e=>{drag=false;try{renderer.domElement.releasePointerCapture(e.pointerId)}catch(_){}});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();autoTour=false;syncTour();targetDist=clamp(targetDist*(e.deltaY>0?1.075:.925),22,55)},{passive:false});
const tourBtn=document.getElementById('tourBtn');function syncTour(){tourBtn.textContent=autoTour?'◉ 巡航中':'◌ 電影巡航'}tourBtn.onclick=()=>{autoTour=!autoTour;if(autoTour)tourTime=0;syncTour()};syncTour();const fxBtn=document.getElementById('fxBtn');function syncFx(){fxBtn.textContent=fxEnabled?'✨ 電影光影':'◇ 基本光影'}fxBtn.onclick=()=>{fxEnabled=!fxEnabled;syncFx()};syncFx();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(composer)composer.setSize(innerWidth,innerHeight)});
let last=0;function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,Math.max(.001,last?(t-last)/1000:1/60));last=t;if(autoTour&&!drag){tourTime+=dt;const a=tourTime*.055;targetYaw=.06+a;targetPitch=.27+.06*Math.sin(a*.70);targetDist=38+3.2*Math.sin(a*.38);targetPanX=.65*Math.sin(a*.27);targetPanZ=-.8+.58*Math.cos(a*.31)}const e=1-Math.exp(-8.5*dt);yaw+=(targetYaw-yaw)*e;pitch+=(targetPitch-pitch)*e;dist+=(targetDist-dist)*e;panX+=(targetPanX-panX)*e;panZ+=(targetPanZ-panZ)*e;const target=look.clone().add(new THREE.Vector3(panX,0,panZ)),cp=Math.cos(pitch),desired=target.clone().add(new THREE.Vector3(Math.sin(yaw)*cp*dist,Math.sin(pitch)*dist,Math.cos(yaw)*cp*dist));camera.position.lerp(desired,.07);smoothLook.lerp(target,.07);camera.lookAt(smoothLook);if(waterMat)waterMat.uniforms.uTime.value=t*.001;animations.forEach(fn=>fn(t));swayers.forEach(s=>{s.g.rotation.z=Math.sin(t*.00055+s.phase)*s.amp;s.g.rotation.x=Math.cos(t*.00042+s.phase)*s.amp*.45});spirits.forEach(s=>{s.a+=s.speed*dt;const rr=s.r+.22*Math.sin(t*.0007+s.phase);s.g.position.x=Math.cos(s.a)*rr;s.g.position.z=Math.sin(s.a)*rr+s.cy;s.g.position.y=1.1+.035*Math.sin(t*.006+s.phase);s.g.rotation.y=-s.a+Math.PI/2});updateLeaderLabels();fireflies.forEach((f,i)=>{f.p.position.y=f.baseY+Math.sin(t*.0012*f.speed+f.phase)*.24;f.p.position.x=f.baseX+Math.sin(t*.00035*f.speed+f.phase)*.10;f.p.position.z=f.baseZ+Math.cos(t*.00031*f.speed+f.phase)*.10;f.p.material.opacity=.33+.42*(.5+.5*Math.sin(t*.002*f.speed+f.phase))});waterfalls.forEach((w,i)=>{w.material.opacity=.38+.10*Math.sin(t*.002+i);w.position.y+=Math.sin(t*.0015+i)*.0005});treeHalo.material.opacity=.72+.10*Math.sin(t*.0012);if(composer&&fxEnabled)composer.render();else renderer.render(scene,camera)}resetView();frame(0);
}catch(err){console.error(err);document.getElementById('bootErrorText').textContent=String(err&&err.stack||err);document.getElementById('bootError').classList.add('show')}})();
