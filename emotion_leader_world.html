<div id="stage"></div>
<div class="hud">
  <div class="title-card" id="titleCard">
    <button class="collapse-btn" id="collapseTitle" aria-label="收合">‹</button>
    <div class="eyebrow">LEAD SHOWCASE · CURATED PARADISE · REMASTER</div>
    <h1>主領班 · 星願共感庭</h1>
    <p class="detail">這不是把家具全部塞上去，而是一座已完成策展的示範世界：高低地形、櫻庭、溪谷、瀑布、遊樂園、觀星台與居民生活被整合成同一張完整地圖。</p>
    <div class="badge">✦ 固定展示 · 不參與排名 · 不可編輯 · 不受重置影響</div>
  </div>
  <div class="hint">拖曳旋轉 · 滾輪縮放 · 右鍵拖曳平移</div>
  <div class="actions">
    <button class="btn primary" id="bestView">◎ 最佳視角</button>
    <button class="btn" id="tourBtn">◌ 電影巡航</button>
    <button class="btn" id="fxBtn">✨ 電影光影</button>
    <button class="btn" id="backBtn">↩ 返回大世界</button>
  </div>
  <div class="story"><b>星願共感庭</b>　前庭是夜市與音樂區，左側是櫻花茶庭，右側是觀星與遊樂園；溪流從願望神木高地穿過島心、落成瀑布。16 位小精靈、列車與遊具都會持續活動。</div>
  <div class="stamp">主領班展示世界 · SHOWCASE ONLY</div>
  <div class="vignette"></div><div class="grain"></div>
</div>

function returnMain(){try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();return}}catch(_){}const params=new URLSearchParams(location.search),room=params.get('room');location.href='emotion_island.html'+(room?'?room='+encodeURIComponent(room):'')}
document.getElementById('backBtn').onclick=returnMain;document.getElementById('collapseTitle').onclick=()=>{const c=document.getElementById('titleCard');c.classList.toggle('collapsed');document.getElementById('collapseTitle').textContent=c.classList.contains('collapsed')?'›':'‹'};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(composer)composer.setSize(innerWidth,innerHeight)});
let last=0;function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,Math.max(.001,last?(t-last)/1000:1/60));last=t;if(autoTour&&!drag){tourTime+=dt;const a=tourTime*.055;targetYaw=.06+a;targetPitch=.28+.055*Math.sin(a*.70);targetDist=33+2.5*Math.sin(a*.38);targetPanX=.55*Math.sin(a*.27);targetPanZ=-.4+.50*Math.cos(a*.31)}const e=1-Math.exp(-8.5*dt);yaw+=(targetYaw-yaw)*e;pitch+=(targetPitch-pitch)*e;dist+=(targetDist-dist)*e;panX+=(targetPanX-panX)*e;panZ+=(targetPanZ-panZ)*e;const target=look.clone().add(new THREE.Vector3(panX,0,panZ)),cp=Math.cos(pitch),desired=target.clone().add(new THREE.Vector3(Math.sin(yaw)*cp*dist,Math.sin(pitch)*dist,Math.cos(yaw)*cp*dist));camera.position.lerp(desired,.07);smoothLook.lerp(target,.07);camera.lookAt(smoothLook);if(waterMat)waterMat.uniforms.uTime.value=t*.001;animations.forEach(fn=>fn(t));swayers.forEach(s=>{s.g.rotation.z=Math.sin(t*.00055+s.phase)*s.amp;s.g.rotation.x=Math.cos(t*.00042+s.phase)*s.amp*.45});spirits.forEach(s=>{s.a+=s.speed*dt;const rr=s.r+.22*Math.sin(t*.0007+s.phase);s.g.position.x=Math.cos(s.a)*rr;s.g.position.z=Math.sin(s.a)*rr+s.cy;s.g.position.y=1.1+.035*Math.sin(t*.006+s.phase);s.g.rotation.y=-s.a+Math.PI/2});fireflies.forEach((f,i)=>{f.p.position.y=f.baseY+Math.sin(t*.0012*f.speed+f.phase)*.24;f.p.position.x=f.baseX+Math.sin(t*.00035*f.speed+f.phase)*.10;f.p.position.z=f.baseZ+Math.cos(t*.00031*f.speed+f.phase)*.10;f.p.material.opacity=.33+.42*(.5+.5*Math.sin(t*.002*f.speed+f.phase))});waterfalls.forEach((w,i)=>{w.material.opacity=.38+.10*Math.sin(t*.002+i);w.position.y+=Math.sin(t*.0015+i)*.0005});treeHalo.material.opacity=.72+.10*Math.sin(t*.0012);if(composer&&fxEnabled)composer.render();else renderer.render(scene,camera)}resetView();frame(0);
}catch(err){console.error(err);document.getElementById('bootErrorText').textContent=String(err&&err.stack||err);document.getElementById('bootError').classList.add('show')}})();
